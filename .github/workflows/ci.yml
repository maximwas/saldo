name: CI

# No secrets anywhere in this workflow: it runs on pull requests (ADR 22, architecture §8)
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # GitHub runs static checks and unit tests only; pgTAP and Playwright e2e run locally (pnpm test:db, pnpm test:e2e)
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm deps
      - run: pnpm exec knip
      - run: pnpm test

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Scan the pushed or proposed commits
        env:
          GITLEAKS_VERSION: 8.30.1
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}"
