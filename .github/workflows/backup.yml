name: Backup

# Never on pull requests: this workflow holds production secrets (ADR 22, 23; architecture §9)
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with: { version: 2.122.0 }
      - run: sudo apt-get install -y --no-install-recommends age
      - name: Dump, archive and encrypt to the age public key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
          PROJECT_REF: mlgcnbtnkrwspzvnuhmz
        # dumps go to files and the plain copies are deleted in this step; nothing from the data reaches the log
        run: |
          set -euo pipefail
          umask 077
          dump_dir="$(mktemp -d)"
          supabase link --project-ref "$PROJECT_REF" > /dev/null
          supabase db dump --linked --role-only -f "$dump_dir/roles.sql"
          supabase db dump --linked -f "$dump_dir/schema.sql"
          supabase db dump --linked --data-only --use-copy -f "$dump_dir/data.sql"
          mkdir -p backup
          tar -C "$dump_dir" -cf - roles.sql schema.sql data.sql | age -r "$AGE_RECIPIENT" -o "backup/saldo-$(date -u +%Y%m%dT%H%MZ).tar.age"
          rm -rf "$dump_dir"
          ls -l backup
      - uses: actions/upload-artifact@v4
        with:
          name: saldo-backup-${{ github.run_id }}
          path: backup/*.tar.age
          retention-days: 30
          if-no-files-found: error
